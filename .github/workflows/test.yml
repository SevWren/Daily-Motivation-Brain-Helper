name: Test Suite

on:
  push:
    branches: [ main, develop, project-restart ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest
    timeout-minutes: 30  # AG16-017: Prevent hanging workflows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pester
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # AG16-005: Pin exact Pester version to prevent breaking changes
          Install-Module -Name Pester -RequiredVersion 5.6.1 -Force -SkipPublisherCheck

      - name: Show environment
        shell: powershell
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          Write-Host "Pester $((Get-Module -ListAvailable Pester | Select-Object -First 1).Version)"

      - name: Run tests with coverage
        shell: powershell
        run: |
          .\Invoke-Tests.ps1 -CI -Coverage $true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults.xml
            coverage.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action/composite@v2
        if: always()
        with:
          files: TestResults.xml
          check_name: Test Results

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

  analyze:
    name: Static Analysis
    runs-on: windows-latest
    timeout-minutes: 10  # AG16-017: Prevent hanging workflows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # AG16-006: Pin PSScriptAnalyzer version to prevent unexpected rule changes
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.22.0 -Force

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: |
          # AG16-009: Fail workflow if PSScriptAnalyzer finds violations
          $results = Invoke-ScriptAnalyzer -Path DailyMotivation.ps1 `
            -Settings .PSScriptAnalyzerSettings.psd1 `
            -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($results.Count) violation(s)"
          }

  build:
    name: Build EXE
    runs-on: windows-latest
    # AG16-010: Require both test AND analyze jobs before build
    needs: [test, analyze]
    timeout-minutes: 15  # AG16-017: Prevent hanging workflows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ps2exe
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # AG16-007: Pin ps2exe version to prevent build failures
          Install-Module -Name ps2exe -RequiredVersion 1.0.14 -Force
          # AG16-022: Validate ps2exe installation
          if (-not (Get-Module -Name ps2exe -ListAvailable)) {
            throw "ps2exe installation failed"
          }

      - name: Build DailyMotivation.exe
        shell: powershell
        run: |
          .\build.ps1

      # AG16-011: Smoke test to validate exe before artifact upload
      - name: Validate executable (smoke test)
        shell: powershell
        run: |
          if (-not (Test-Path DailyMotivation.exe)) {
            throw "DailyMotivation.exe not found"
          }
          $size = (Get-Item DailyMotivation.exe).Length
          if ($size -lt 100KB) {
            throw "Exe too small ($size bytes), likely corrupted"
          }
          Write-Host "Exe validated successfully: $([math]::Round($size/1MB, 2)) MB"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyMotivation-exe
          path: DailyMotivation.exe
