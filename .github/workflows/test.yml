name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -Force
          Install-Module -Name InvokeBuild -Force

      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          Write-Host "Pester Version: $((Get-Module -ListAvailable Pester | Select-Object -First 1).Version)"
          Write-Host "PSScriptAnalyzer Version: $((Get-Module -ListAvailable PSScriptAnalyzer | Select-Object -First 1).Version)"

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Invoke-Build Analyze

      - name: Run Tests
        shell: pwsh
        run: |
          Invoke-Build Test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults.xml
            coverage.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action/composite@v2
        if: always()
        with:
          files: TestResults.xml
          check_name: Test Results

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        if: always()
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          output: both

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

  build:
    name: Build Executables
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Force
          Install-Module -Name InvokeBuild -Force

      - name: Build
        shell: pwsh
        run: |
          Invoke-Build Build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: executables
          path: Output/*.exe

  analyze:
    name: Static Analysis
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force
          Install-Module -Name InvokeBuild -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Invoke-Build Analyze

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: scriptanalyzer-results.sarif
