name: Test Suite

on:
  push:
    branches: [ main, develop, project-restart, project-restart-pwsh7 ]
    tags: [ 'v*' ]         # Story 2.9: trigger release job on semver tags
  pull_request:
    branches: [ main, develop, project-restart-pwsh7 ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Nightly at 03:00 UTC (Story 2.8)

jobs:
  test:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # Timeout prevents hung runners from blocking the queue
    permissions:
      checks: write
      pull-requests: write
    strategy:                        # Story 2.1: cross-platform matrix
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false               # let both platforms report independently

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # Pinned version prevents unexpected breakage from PSGallery minor updates
          Install-Module -Name Pester -RequiredVersion 5.6.1 -Force -SkipPublisherCheck

      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"
          Write-Host "Pester $((Get-Module -ListAvailable Pester | Select-Object -First 1).Version)"
          Write-Host "OS: $env:RUNNER_OS"

      - name: Run tests with coverage
        shell: pwsh
        run: |
          # Coverage only on Windows: Linux runs platform-abstraction tests only,
          # which represent a subset of the codebase -- measuring partial coverage
          # against the full source gives a misleadingly low number.
          $runCoverage = $env:RUNNER_OS -eq 'Windows'
          .\Invoke-Tests.ps1 -CI -Coverage $runCoverage

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}  # per-OS to avoid matrix name collision
          path: |
            TestResults.xml
            coverage.xml
          retention-days: 30                    # Story 2.7

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action/composite@v2
        if: always()
        with:
          files: TestResults.xml
          check_name: Test Results (${{ matrix.os }})

  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest          # CodeCoverageSummary is a container action (Linux-only)
    needs: test
    if: ${{ !cancelled() }}         # run even if test had failures; gate is independent

    steps:
      - name: Download Windows coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: test-results-windows-latest

      - name: Check coverage threshold
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '70 80'       # warn at 70%, fail below 70% (Story 2.5)
          fail_below_min: true

  analyze:
    name: Static Analysis
    runs-on: windows-latest
    timeout-minutes: 10  # Timeout prevents hung runners from blocking the queue

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # Pinned version prevents unexpected rule changes from PSGallery updates
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.22.0 -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          # Fail fast on any analyzer violation - do not suppress warnings
          $results = Invoke-ScriptAnalyzer -Path DailyMotivation.ps1 `
            -Settings .PSScriptAnalyzerSettings.psd1 `
            -Severity Warning,Error
          if ($results) {
            $results | Format-Table -AutoSize
            throw "PSScriptAnalyzer found $($results.Count) violation(s)"
          }

      - name: Check for PS7-only syntax incompatible with ps2exe
        shell: pwsh
        run: |
          # ps2exe compiles DailyMotivation.ps1 to a .NET Framework 4.x exe.
          # These PS7+ features are not available in .NET Framework 4.x and will
          # cause runtime failures in the compiled exe despite #Requires -Version 7.0.
          $patterns = [ordered]@{
            'Join-String cmdlet (use -join operator instead)'  = '(?<![A-Za-z0-9_\-])Join-String\b'
            'Null coalescing operator ?? (PS7+)'               = '[^\?]\?\?[^=\?]'
            'Null conditional operator ?. (PS7+)'              = '\?\.'
            'ForEach-Object -Parallel (PS7+)'                  = 'ForEach-Object\s+-Parallel'
          }
          $content = Get-Content DailyMotivation.ps1 -Raw
          $violations = @()
          foreach ($desc in $patterns.Keys) {
            if ($content -match $patterns[$desc]) {
              $violations += "FAIL: $desc - pattern: $($patterns[$desc])"
            }
          }
          if ($violations) {
            $violations | ForEach-Object { Write-Host "::error::$_" }
            throw "PS7+ syntax incompatible with ps2exe .NET Framework 4.x found in DailyMotivation.ps1"
          }
          Write-Host "PS7+ syntax gate passed - no ps2exe-incompatible patterns detected"

  build:
    name: Build EXE
    runs-on: windows-latest
    # Build only when tests, coverage gate, and static analysis all pass
    needs: [test, coverage-gate, analyze]
    timeout-minutes: 15  # Timeout prevents hung runners from blocking the queue

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install ps2exe
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          # Pinned version prevents build failures from ps2exe API changes
          Install-Module -Name ps2exe -RequiredVersion 1.0.14 -Force
          # Verify module install succeeded before attempting build
          if (-not (Get-Module -Name ps2exe -ListAvailable)) {
            throw "ps2exe installation failed"
          }

      - name: Build DailyMotivation.exe
        shell: powershell
        run: |
          .\build.ps1

      # Validate exe size before upload - corrupted builds are silently small
      - name: Validate executable (smoke test)
        shell: powershell
        run: |
          if (-not (Test-Path DailyMotivation.exe)) {
            throw "DailyMotivation.exe not found"
          }
          $size = (Get-Item DailyMotivation.exe).Length
          if ($size -lt 100KB) {
            throw "Exe too small ($size bytes), likely corrupted"
          }
          Write-Host "Exe validated successfully: $([math]::Round($size/1MB, 2)) MB"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: DailyMotivation-exe
          path: DailyMotivation.exe
          retention-days: 30  # Story 2.7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, coverage-gate, analyze, build]
    # Story 2.9: only run on tag pushes; skip on branch pushes and PRs
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: DailyMotivation-exe

      - name: Create GitHub release with auto-generated notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true   # auto-changelog from merged PRs/commits since last tag
          files: DailyMotivation.exe
          fail_on_unmatched_files: true
