name: Bug report
description: Report incorrect behavior in the app, build, or tests
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For security issues, use [SECURITY.md](../SECURITY.md) instead of a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open DailyMotivation.exe
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Execution mode
      options:
        - main (double-click / UI)
        - popup (/popup)
        - setfolder (context menu)
        - build / tests only
        - unknown
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: pwsh
    attributes:
      label: PowerShell version (if relevant)
      placeholder: "7.4.x"
  - type: dropdown
    id: artifact
    attributes:
      label: How did you run the app?
      options:
        - Compiled DailyMotivation.exe
        - Source DailyMotivation.ps1
        - Tests only
        - N/A
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Prefer %APPDATA%\\DailyMotivationBrainHelper\\popup_log.txt (paths are hashed). Redact secrets.
