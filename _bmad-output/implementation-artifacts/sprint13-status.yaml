# Sprint 13: Multi-Folder Scheduling Integration Tests

## Story Summary
Closes #158 AG20-001 (Critical)

Add integration tests that schedule two or more distinct folders simultaneously
to verify tasks.json consistency with N entries and selective removal.

## Acceptance Criteria

1. **Given** the test environment has a clean temp APPDATA dir and Register-ScheduledTask is mocked,
   **When** `New-MotivationTask` is called for three distinct FolderPaths in the same session,
   **Then** `tasks.json` contains exactly three PENDING entries, each with a unique TaskId, and `Get-ScheduledTask` is called three times.

2. **Given** two tasks are registered for different folders,
   **When** `Remove-MotivationTask` is called for one TaskId,
   **Then** `tasks.json` retains exactly one PENDING entry and `Unregister-ScheduledTask` is called exactly once with the correct task name.

3. **Given** a tasks.json with three entries,
   **When** `Get-MotivationTasks` is called,
   **Then** all three tasks are returned with correct FolderPath values (case-insensitive match).

## Implementation Plan

1. Check existing Tests/Integration/AG20-001.MultiFolderScheduling.Tests.ps1
2. Enhance tests to cover all three acceptance criteria
